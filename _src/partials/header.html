<div class="announce" role="region" aria-label="Announcement">
  <p class="announce__text">Free shipping on orders above ₹999 <span aria-hidden="true">•</span> Hand-poured in India</p>
</div>

<header class="site-header" id="site-header">
  <div class="container header__inner">
    <button class="icon-btn menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu" data-menu-open>
      <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>

    <a class="logo" href="index.html" aria-label="Scentavelle — Scents for a softer life. Home">
      <svg class="logo__flame" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 2c.9 4.200 5.500 6.800 5.500 11.600a5.500 5.500 0 01-11 0c0-2.600 1.200-4.200 2.600-5.400.2 1.700 1 2.500 2.100 2.700C10.400 8.800 10.900 5.200 12 2z"/><path d="M12 19.500v3.500M8 27h8"/></svg>
      <span class="logo__word">SCENTAVELLE</span>
      <span class="logo__tag">Scents for a softer life</span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <ul>
          {{NAV}}
      </ul>
    </nav>

    <div class="header__actions">
      <button class="icon-btn" type="button" aria-label="Search candles" data-search-open>
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn header__account" type="button" aria-label="Account and order help" data-account-open>
        <svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>
      </button>
      <a class="icon-btn cart-link" href="cart.html" aria-label="Cart, 0 items" data-cart-link>
        <svg class="icon" aria-hidden="true"><use href="#i-bag"/></svg>
        <span class="cart-count" data-cart-count hidden>0</span>
      </a>
    </div>
  </div>

  <div class="search-panel" id="search-panel" hidden>
    <div class="container">
      <form class="search-panel__form" role="search" action="shop.html" method="get" data-search-form>
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="sr-only" for="site-search">Search candles</label>
        <input id="site-search" name="q" type="search" placeholder="Search by name, note or mood — try “vanilla”" autocomplete="off">
        <button class="btn btn--sm btn--primary" type="submit">Search</button>
        <button class="icon-btn" type="button" aria-label="Close search" data-search-close><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </form>
      <div class="search-panel__results" data-search-results aria-live="polite"></div>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu" aria-hidden="true" inert>
  <div class="mobile-menu__top">
    <a class="logo logo--small" href="index.html" aria-label="Scentavelle home"><span class="logo__word">SCENTAVELLE</span></a>
    <button class="icon-btn" type="button" aria-label="Close menu" data-menu-close><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <nav aria-label="Mobile">
    <ul class="mobile-menu__list">
          {{NAV_MOBILE}}
    </ul>
  </nav>
  <div class="mobile-menu__foot">
    <a class="btn btn--primary btn--block" href="https://wa.me/917569403967" target="_blank" rel="noopener" data-wa-generic>
      <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg> Chat with Mahesh
    </a>
    <p class="mobile-menu__phone">+91 75694 03967</p>
    <p class="mobile-menu__tag">Scents for a softer life.</p>
  </div>
</div>
<div class="scrim" data-menu-close hidden></div>
